[project]
name = "mdkb"
version = "0.1.0"
description = "Textbook PDF -> structured Markdown knowledge base engine"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
dev = ["pytest"]
ocr = ["pytesseract", "pillow"]

[project.scripts]
mdkb = "mdkb.cli:main"

[tool.setuptools]
packages = ["mdkb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
